name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"

jobs:
  r-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: eddelbuettel/github-actions/r-ci@master

      - name: Dependencies
        # Direct call instead of relying on 'run.sh install_deps'
        # as the DESCRIPTION file is in subdirectory r-pkg
        run: ./run.sh install_r tinytest

      - name: Build
        # Direct call of build instead of relying on 'run.sh run_tests'
        # as the packages is in subdirectory r-pkg
        run: R CMD build r-pkg

      - name: Check
        # Direct call of tests instead of relying on 'run.sh run_tests'
        # as the packages is in subdirectory r-pkg
        run: R CMD check rapt_*.tar.gz --no-manual

      - name: Test
        run: |
          R CMD INSTALL rapt_*.tar.gz
          Rscript -e 'tinytest::test_package("rapt")'

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: r_package
          path: rapt_*.tar.gz

  daemon:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build daemon
        run: make -C daemon

      - name: Check daemon runs
        run: |
          ./daemon/raptd --help || true
          file ./daemon/raptd

  deb-package:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # Publishes share one group so they serialise, as two of them would both
    # regenerate docs/ and race to push, and the loser cannot rebase its way
    # out because the conflicting files are a .deb and a gzip. Ordinary builds
    # get a group per ref so pull requests still run in parallel.
    concurrency:
      group: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && 'publish' || format('build-{0}', github.ref) }}
      cancel-in-progress: false

    env:
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
      # A dispatch publishes into the branch it was run against, so this can be
      # tested before it reaches master. A tag build has nowhere of its own to
      # push, as it checks out a detached HEAD, so it targets master.
      TARGET: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'master' }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: eddelbuettel/github-actions/r-ci@master

      - name: Debian Dependencies
        run: ./run.sh install_aptget debhelper apt-utils

      # apt indexes checksums per version, so two different .deb files sharing
      # one version make every client that already fetched the old one whine
      # about a hash mismatch. A tag must therefore match debian/changelog, and
      # a snapshot gets a version of its own.
      - name: Version
        run: |
          cur=$(cd pkg && dpkg-parsechangelog -S Version)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              # Accept the tag with or without the Debian revision, so both
              # v0.1.0 and v0.1.0-1 match a changelog reading 0.1.0-1.
              want=${GITHUB_REF_NAME#v}
              if [ "$cur" != "$want" ] && [ "${cur%-*}" != "$want" ]; then
                  echo "tag ${GITHUB_REF_NAME} wants ${want}, pkg/debian/changelog has ${cur}"
                  exit 1
              fi
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              # The run number, not just the date, as two dispatches of one
              # commit on one day would otherwise share a version while the
              # generated changelog date makes their .deb files differ.
              snap="${cur}+git$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}.$(git rev-parse --short HEAD)"
              { printf 'rapt (%s) unstable; urgency=medium\n\n  * Snapshot build.\n\n -- github-actions <actions@github.com>  %s\n\n' \
                     "$snap" "$(date -uR)"
                cat pkg/debian/changelog
              } > changelog.new
              mv changelog.new pkg/debian/changelog
              echo "building snapshot ${snap}"
          fi

      - name: Debian Build
        run: cd pkg && dpkg-buildpackage -rfakeroot -us -uc -b -tc

      - name: Check Package
        run: dpkg -c rapt_*.deb

      # Dry run, so a pull request still proves the repository builds. The
      # publish steps below do the real thing against the target branch.
      - name: Update Repository
        if: env.PUBLISH != 'true'
        run: tools/mkrepo.sh rapt_*.deb

      # The target branch goes in a subdirectory because the build above may be
      # sitting on a tag, and a detached HEAD has no branch to push back to.
      - name: Checkout Target
        if: env.PUBLISH == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET }}
          path: target

      - name: Publish Repository
        if: env.PUBLISH == 'true'
        run: |
          target/tools/mkrepo.sh rapt_*.deb
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git diff --quiet --cached || git commit -m "Update apt repository"
          git push origin "HEAD:${TARGET}"
