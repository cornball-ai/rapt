name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"

jobs:
  r-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: eddelbuettel/github-actions/r-ci@master

      - name: Dependencies
        # Direct call instead of relying on 'run.sh install_deps'
        # as the DESCRIPTION file is in subdirectory r-pkg
        run: ./run.sh install_r tinytest

      - name: Build
        # Direct call of build instead of relying on 'run.sh run_tests'
        # as the packages is in subdirectory r-pkg
        run: R CMD build r-pkg

      - name: Check
        # Direct call of tests instead of relying on 'run.sh run_tests'
        # as the packages is in subdirectory r-pkg
        run: R CMD check rapt_*.tar.gz --no-manual

      - name: Test
        run: |
          R CMD INSTALL rapt_*.tar.gz
          Rscript -e 'tinytest::test_package("rapt")'

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: r_package
          path: rapt_*.tar.gz

  daemon:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build daemon
        run: make -C daemon

      - name: Check daemon runs
        run: |
          ./daemon/raptd --help || true
          file ./daemon/raptd

  repo-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Dependencies
        run: sudo apt-get install -y apt-utils

      - name: Repository Tests
        run: tools/test-mkrepo.sh

  deb-package:
    # One leg per suite and architecture that r2u itself serves. There is no
    # arm64 jammy because r2u has none, and a rapt with no r-cran-* packages
    # to bridge to would be a package that cannot do its job.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: jammy,    arch: amd64, runner: ubuntu-latest }
          - { suite: noble,    arch: amd64, runner: ubuntu-latest }
          - { suite: noble,    arch: arm64, runner: ubuntu-24.04-arm }
          - { suite: resolute, arch: amd64, runner: ubuntu-latest }
          - { suite: resolute, arch: arm64, runner: ubuntu-24.04-arm }

    runs-on: ${{ matrix.runner }}
    # The suite comes from the image and the architecture from the runner, so
    # each build is native rather than emulated.
    container: rocker/r2u:${{ matrix.suite }}

    steps:
      - name: Dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
              debhelper fakeroot r-base-dev apt-utils git ca-certificates

      - uses: actions/checkout@v7

      # The artifact is named from the matrix while the package is built by
      # whatever this container and runner actually are. Let those disagree and
      # the .deb is still built and indexed locally, then collected under the
      # wrong suite and published there.
      - name: Verify Build Identity
        run: |
          got_suite=$(. /etc/os-release; echo "${VERSION_CODENAME}")
          got_arch=$(dpkg --print-architecture)
          if [ "${got_suite}" != "${{ matrix.suite }}" ]; then
              echo "container is ${got_suite}, matrix says ${{ matrix.suite }}" >&2
              exit 1
          fi
          if [ "${got_arch}" != "${{ matrix.arch }}" ]; then
              echo "runner is ${got_arch}, matrix says ${{ matrix.arch }}" >&2
              exit 1
          fi
          echo "confirmed ${got_suite}/${got_arch}"

      # apt indexes checksums per version, so two different .deb files sharing
      # one version make every client that already fetched the old one whine
      # about a hash mismatch. A tag must therefore match debian/changelog, a
      # snapshot gets a version of its own, and every build is suffixed with
      # the suite it was compiled against.
      - name: Version
        run: |
          suite=$(. /etc/os-release; echo "${VERSION_CODENAME}")
          echo "SUITE=${suite}" >> "$GITHUB_ENV"

          cur=$(cd pkg && dpkg-parsechangelog -S Version)
          note="Build for ${suite}."

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              # Accept the tag with or without the Debian revision, so both
              # v0.1.0 and v0.1.0-1 match a changelog reading 0.1.0-1.
              want=${GITHUB_REF_NAME#v}
              if [ "$cur" != "$want" ] && [ "${cur%-*}" != "$want" ]; then
                  echo "tag ${GITHUB_REF_NAME} wants ${want}, pkg/debian/changelog has ${cur}"
                  exit 1
              fi
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              # The run number, not just the date, as two dispatches of one
              # commit on one day would otherwise share a version while the
              # generated changelog date makes their .deb files differ.
              cur="${cur}+git$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}.$(git rev-parse --short HEAD)"
              note="Snapshot build."
          fi

          new="${cur}~${suite}"
          { printf 'rapt (%s) unstable; urgency=medium\n\n  * %s\n\n -- github-actions <actions@github.com>  %s\n\n' \
                 "$new" "$note" "$(date -uR)"
            cat pkg/debian/changelog
          } > changelog.new
          mv changelog.new pkg/debian/changelog
          echo "building ${new}"

      - name: Debian Build
        run: cd pkg && dpkg-buildpackage -rfakeroot -us -uc -b -tc

      - name: Check Package
        run: dpkg -c rapt_*.deb

      # Proves this suite's packages index on every pull request, where the
      # publish job below does not run.
      - name: Update Repository
        run: tools/mkrepo.sh "${SUITE}" rapt_*.deb

      - name: Upload Package
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.suite }}-${{ matrix.arch }}
          path: rapt_*.deb

  # Matrix legs get a runner each, with no disk between them, so the packages
  # come back as artifacts and are published together here. One commit for the
  # whole matrix rather than five racing to push.
  publish:
    # repo-tests as well as the builds, or a broken mkrepo.sh could fail its
    # own tests while this job still pushed a repository built with it.
    needs: [deb-package, repo-tests]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      # A dispatch publishes into the branch it was run against, so this can be
      # tested before it reaches master. A tag build has nowhere of its own to
      # push, as it checks out a detached HEAD, so it targets master.
      TARGET: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'master' }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET }}

      - name: Fetch Packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: incoming

      - name: Dependencies
        run: sudo apt-get install -y apt-utils

      - name: Update Repository
        run: tools/publish.sh incoming

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git diff --quiet --cached || git commit -m "Update apt repository"
          git push origin "HEAD:${TARGET}"
