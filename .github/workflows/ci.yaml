name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"

jobs:
  r-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: eddelbuettel/github-actions/r-ci@master

      - name: Dependencies
        # Direct call instead of relying on 'run.sh install_deps'
        # as the DESCRIPTION file is in subdirectory r-pkg
        run: ./run.sh install_r tinytest

      - name: Build
        # Direct call of build instead of relying on 'run.sh run_tests'
        # as the packages is in subdirectory r-pkg
        run: R CMD build r-pkg

      - name: Check
        # Direct call of tests instead of relying on 'run.sh run_tests'
        # as the packages is in subdirectory r-pkg
        run: R CMD check rapt_*.tar.gz --no-manual

      - name: Test
        run: |
          R CMD INSTALL rapt_*.tar.gz
          Rscript -e 'tinytest::test_package("rapt")'

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: r_package
          path: rapt_*.tar.gz

  daemon:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build daemon
        run: make -C daemon

      - name: Check daemon runs
        run: |
          ./daemon/raptd --help || true
          file ./daemon/raptd

  deb-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: eddelbuettel/github-actions/r-ci@master

      - name: Debian Dependencies
        run: ./run.sh install_aptget debhelper apt-utils

      - name: Debian Build
        run: cd pkg && dpkg-buildpackage -rfakeroot -us -uc -b -tc

      - name: Check Package
        run: dpkg -c rapt_*.deb

      - name: Upload Package
        uses: actions/upload-artifact@v7
        with:
          name: deb_package
          path: rapt_*.deb

      # Dry run: proves the repository still builds on every pull request.
      # The 'publish' job below does the same thing for real.
      - name: Update Repository
        run: tools/mkrepo.sh rapt_*.deb

  publish:
    needs: deb-package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Always publish from master, as a tag build checks out a detached HEAD
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: Fetch Package
        uses: actions/download-artifact@v8
        with:
          name: deb_package

      - name: Dependencies
        run: sudo apt-get install -y apt-utils

      - name: Update Repository
        run: tools/mkrepo.sh rapt_*.deb

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --quiet --cached || git commit -m "Update apt repository"
          git push origin master
